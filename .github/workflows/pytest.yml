name: pytest

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python >= 3.11; 3.13 matches contract-parity.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # Only the dev extra: the `analysis` extra installs upstream
        # code-analysis-tool, which would shadow the vendored src/code_audit.
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        # No `|| true` / continue-on-error: a failing test must fail the job.
        run: python -m pytest -q
