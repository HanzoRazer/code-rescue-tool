name: contract-parity

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily check to catch upstream changes
    - cron: '0 6 * * *'

jobs:
  contract-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check upstream contract parity
        env:
          # Pinned, never `main`: an unpinned ref turns this check red the
          # moment upstream merges a contract change, with no change here.
          # Interim pin = code-analysis-tool PR #38 head (run_result_v2,
          # package 0.2.0). Re-point to tag v0.2.0 once it is cut on main.
          UPSTREAM_REF: 226073b639712022199bf4208d8016083f1a8e1b
          # Default: enabled. Set to 0 to skip rule registry parity temporarily.
          CHECK_RULE_REGISTRY: "1"
        run: python ci/check_upstream_contracts.py
